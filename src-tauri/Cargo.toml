[package]
name = "medaljemaker"
version = "1.0.0"
description = "Lag medaljer for 3D-printing"
authors = ["Medaljemaker"]
license = ""
repository = "https://github.com/ahottesen/medal_app"
edition = "2021"
rust-version = "1.80"

[lib]
name = "medaljemaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
