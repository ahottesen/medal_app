name: Skrivebordsapp (macOS, Windows, Linux)

# Bygger skrivebordsappen med Tauri på alle tre operativsystemene.
# - Pull requests / manuell kjøring: installasjonsfilene lastes opp som artefakter på kjøringen.
# - Tagg som starter med «v» (f.eks. v1.0.0): det lages et utkast til GitHub Release med filene.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: windows
            platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux-avhengigheter
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Test geometrimotoren
        if: matrix.name == 'linux'
        run: npm run test:geometry

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Medaljemaker {0}', github.ref_name) || '' }}
          releaseBody: |
            Last ned filen for ditt system:
            - **macOS** (Apple Silicon og Intel): `.dmg`
            - **Windows**: `.msi` eller `-setup.exe`
            - **Linux**: `.AppImage` (kjør direkte), `.deb` (Ubuntu/Debian) eller `.rpm` (Fedora)

            Appen er ikke signert. Første gang du åpner den:
            - **macOS**: høyreklikk på appen → «Åpne» → «Åpne». Får du beskjed om at appen er «skadet», kjør `xattr -cr /Applications/Medaljemaker.app` i Terminal.
            - **Windows**: trykk «Mer info» → «Kjør likevel» hvis SmartScreen advarer.
            - **Linux (AppImage)**: gjør filen kjørbar (`chmod +x`) og start den.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Last opp installasjonsfiler
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: medaljemaker-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
